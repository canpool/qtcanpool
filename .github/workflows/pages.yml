name: Pages

# Builds both halves of the published site -- the Doxygen documentation and the
# WebAssembly demo -- and publishes them together. A repository has exactly one
# GitHub Pages site, so the two cannot be deployed by separate workflows without
# overwriting each other: the docs own the root and the demo lives under /demo/.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Without it the deploy job fails, while the two build
# jobs still run and report.

on:
  push:
    branches: [ master, develop, 'release-*' ]
    paths:
      - 'doc/**'
      - 'src/libs/**'
      - 'demos/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ master, develop, 'release-*' ]
    paths:
      - 'doc/**'
      - 'src/libs/**'
      - 'demos/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        # Doxygen and Graphviz come from the distribution here rather than from a
        # pinned download: the Doxyfile deliberately sticks to long standing
        # settings, so a version drift only changes the warning count, and the
        # ~50 MB tarball from doxygen.nl is a failure point worth not having.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Configure
        run: cmake -S doc -B build-docs -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-docs --target docs

      - name: Summary
        run: |
          # Count the warnings themselves, not the lines of the log: entries such
          # as "Possible candidates:" and the "parameter 'x'" follow-ups continue
          # a warning on their own line, and counting them inflates the number by
          # roughly a third. grep exits non-zero when nothing matches, hence the
          # explicit fallback -- the step would otherwise fail on a clean build.
          {
            echo "### Documentation site"
            echo
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| Doxygen | $(doxygen --version) |"
            echo "| Warnings | $(grep -cE ': (warning|error):' build-docs/doxygen-warnings.log || echo 0) |"
            echo "| HTML pages | $(find build-docs/html -maxdepth 1 -name '*.html' | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-warnings
          path: build-docs/doxygen-warnings.log
          if-no-files-found: ignore

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build-docs/html

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt for WebAssembly
        # aqtinstall rather than a Qt installer action: the very same command
        # works on a developer machine, so a failure here is reproducible locally.
        # The version has to match the desktop builds, and the arch has to be the
        # single-threaded one -- Qt's threaded WebAssembly build needs the
        # COOP/COEP headers that GitHub Pages does not send.
        #
        # A host Qt of the same version is needed on top of it: the WebAssembly
        # kit ships no moc/rcc/uic, because those run on the build machine. Only
        # two archives are fetched, since the host installation exists purely to
        # provide those three tools: "qtbase" carries them, and "icu" carries the
        # ICU runtime they link against -- Qt's Linux binaries bundle ICU in its
        # own archive, so with qtbase alone qmake and rcc die with "libicui18n.
        # so.73: cannot open shared object file" before a single file is built.
        run: |
          pip install aqtinstall
          aqt install-qt all_os wasm 6.8.3 wasm_singlethread -O "$RUNNER_TEMP/Qt"
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/QtHost" --archives qtbase icu

      - name: Install Emscripten
        # Qt 6.8 targets Emscripten 3.1.56, and the version is not interchangeable
        # between Qt minor releases (Emscripten makes no ABI promise), so it is
        # pinned rather than tracking latest.
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.56
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.56

      - name: Build the demo
        # Configuration and build share one step because emsdk only exports the
        # toolchain through the environment of the shell that activates it.
        #
        # Qt's own toolchain file is used rather than a bare "emcmake cmake": it
        # is what pulls in the Qt WebAssembly helper macros, without which the
        # target finalization aborts on an undefined _qt_test_emscripten_version.
        # It chainloads the Emscripten toolchain itself.
        #
        # QTC_STATIC_BUILD: Qt for WebAssembly only supports static libraries, so
        # the default shared build cannot link against it at all.
        # BUILD_WITH_PCH: the precompiled headers are rejected by the Emscripten
        # compiler ("__PIC__ level differs in PCH file vs. current file").
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" > /dev/null
          cmake -S . -B build-wasm \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/Qt/6.8.3/wasm_singlethread/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE="$RUNNER_TEMP/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DQT_HOST_PATH="$RUNNER_TEMP/QtHost/6.8.3/gcc_64" \
            -DQTC_STATIC_BUILD=ON \
            -DBUILD_WITH_PCH=OFF \
            -DWITH_DEMOS=ON \
            -DWITH_TESTS=OFF
          cmake --build build-wasm --target AppShellDemo --parallel
          em++ --version
          ls -la build-wasm/bin

      - name: Collect the site
        run: |
          mkdir -p site/demo
          # The finalization turns the target into the .html/.js/.wasm triple the
          # browser loads, plus the Qt loader and any preloaded asset.
          cp build-wasm/bin/AppShellDemo.html site/demo/index.html
          # The generated page pulls in AppShellDemo.js (which loads the .wasm by
          # name), the Qt loader and the logo.
          find build-wasm/bin -maxdepth 1 \
            \( -name 'AppShellDemo.js' -o -name 'AppShellDemo.wasm' \
               -o -name 'AppShellDemo.data' -o -name 'qtloader.js' \
               -o -name 'qtlogo.svg' \) \
            -exec cp {} site/demo/ \;
          ls -la site/demo

      - name: Summary
        run: |
          {
            echo "### WebAssembly demo"
            echo
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| Emscripten | 3.1.56 |"
            echo "| Qt | 6.8.3 / wasm_singlethread |"
            echo "| Payload | $(du -sh site/demo | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the demo
        uses: actions/upload-artifact@v4
        with:
          name: wasm-demo
          path: site/demo

  deploy:
    name: deploy
    # Only the release branches own the published site, otherwise every push to
    # a development branch would overwrite it.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release-')
    needs: [ docs, wasm ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Assemble the site
        run: mkdir -p _site

      - uses: actions/download-artifact@v4
        with:
          name: doxygen-html
          path: _site

      - uses: actions/download-artifact@v4
        with:
          name: wasm-demo
          path: _site/demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
