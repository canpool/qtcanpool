name: CI

on:
  push:
    branches: [ master, develop, 'release-*' ]
  pull_request:
    branches: [ master, develop, 'release-*' ]
  workflow_dispatch:

jobs:
  build:
    name: build / ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  qt: '6.8.1' }
          - { os: windows-latest, qt: '6.8.1' }
          - { os: macos-latest,   qt: '6.8.1' }
          - { os: ubuntu-latest,  qt: '5.15.2' }
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_DEMOS=ON
          -DWITH_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          # Headless CI runner: use the offscreen platform to avoid GUI test failures.
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Check the installed SDK is consumable
        # One leg is enough: the export is platform independent, and it is the
        # combination of the installed targets, headers and the Qt dependency
        # that is being exercised, not the compiler. projects/consume is a real
        # downstream project that knows nothing but find_package(QtCanpool).
        if: matrix.os == 'ubuntu-latest' && matrix.qt == '6.8.1'
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/sdk"
          cmake --install build --config Release --prefix "$RUNNER_TEMP/sdk" --component Devel
          # Append rather than override: CMAKE_PREFIX_PATH already carries Qt.
          export CMAKE_PREFIX_PATH="$RUNNER_TEMP/sdk:$CMAKE_PREFIX_PATH"
          cmake -S projects/consume -B "$RUNNER_TEMP/consume" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/consume" --parallel

      - name: Check the scaffolding script produces a buildable project
        # Decision K9 put the skeleton in a script rather than in a second
        # template project, which makes the script the only thing between a
        # newcomer and a broken start - and the only way to know it still works
        # is to run it against a real SDK. Reuses the prefix installed above.
        if: matrix.os == 'ubuntu-latest' && matrix.qt == '6.8.1'
        run: |
          python3 scripts/new-project ci_scaffold -o "$RUNNER_TEMP/scaffold" \
            --build --sdk "$RUNNER_TEMP/sdk"
          test -x "$RUNNER_TEMP/scaffold/ci_scaffold/build/ci_scaffold"

      - name: Check an out-of-tree plugin builds and loads
        # Roadmap DoD #1. Building projects/plugin proves a plugin can be built
        # from an installed SDK alone; then the acceptance host loads it for
        # real, which is a different failure mode - an IID that does not match
        # or metadata moc did not embed still compiles, loads and never casts.
        # Reuses the prefix installed above.
        if: matrix.os == 'ubuntu-latest' && matrix.qt == '6.8.1'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export CMAKE_PREFIX_PATH="$RUNNER_TEMP/sdk:$CMAKE_PREFIX_PATH"
          cmake -S projects/plugin -B "$RUNNER_TEMP/plugin" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/plugin" --parallel
          "$RUNNER_TEMP/plugin/qxpluginhost"

  native:
    # The Windows window procedure, driven through a real window. Report only
    # (K8): this is the first time any of windowcontext_win.cpp has been executed
    # by CI at all, and it needs something a headless runner does not promise -
    # a desktop the platform plugin can map a window on. If it turns out to be
    # reliable, promoting it to a gate is a one-line change.
    #
    # A job of its own rather than one more step in `build` above, because
    # everything above is a gate and this is not: a non-gating step sharing a job
    # with a gate either holds the gate up or, once it has `continue-on-error`,
    # makes "the job passed" mean two different things. That is the same lesson
    # that moved clang-tidy out of `quality`, and continue-on-error is set on the
    # job here for the same reason it is set on the step there - a failure in this
    # job is never the workflow's answer.
    name: qxwindow native (report only)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Configure
        # Demos off: this job builds one target, and configuring every demo to
        # build one of them is paying for the whole tree. The demo-bound tests
        # guard themselves with `if (TARGET ...)`, so nothing here goes missing.
        run: >
          cmake -S . -B build-native
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_DEMOS=OFF
          -DWITH_TESTS=ON

      - name: Build
        # One target rather than the tree: the test links qxwindow and nothing
        # else, and the gating job above already builds everything.
        run: cmake --build build-native --config Release --parallel --target tst_qxwindow_native

      - name: Test the window procedure
        shell: bash
        env:
          # The one place in CI that does not use offscreen, deliberately:
          # offscreen installs no window procedure, so every case would skip and
          # the job would pass having tested nothing.
          QT_QPA_PLATFORM: windows
        run: |
          set -u
          # GitHub runs a `run:` block as `bash -e -o pipefail`, and -e is wrong
          # for this one: every command below probes something and its non-zero
          # status is an answer, not a failure. `grep -c` is the clearest case -
          # it exits 1 when it counts no matches, which here is the good result -
          # and under -e the assignment would abort the script silently, before
          # the digest was printed. The exit code is decided at the end instead.
          set +e

          # The binary rather than ctest, for the one thing this job exists to
          # say: how many cases actually ran. A fully skipped suite still exits
          # zero, and ctest keeps a passing test's output out of its log, so
          # through ctest "the platform plugin never loaded and everything
          # skipped" and "the window procedure works" are the same green tick.
          EXE=$(find build-native -name 'tst_qxwindow_native.exe' -type f | head -n 1)
          if [ -z "${EXE}" ]; then
            echo "::error::the test binary was not built"
            exit 1
          fi

          # -o writes the report to a file rather than stdout because under the
          # windows platform plugin this binary's stdout is empty: redirecting it
          # produces a zero byte log, which is easy to mistake for a silent
          # failure. The timeout is here because this class of test is the one
          # that can hang inside a modal loop.
          if timeout 120 "${EXE}" -o native-report.txt,txt; then
            STATUS=0
          else
            STATUS=$?
          fi

          # An empty report is its own failure mode, and it is the quiet one: a
          # binary that died before QtTest started writes nothing, grep then
          # counts no skips, and the job below would read that as a clean pass.
          if [ ! -s native-report.txt ]; then
            echo "::error::the test wrote no report, so it did not start (exit ${STATUS})"
            exit 1
          fi

          cat native-report.txt
          SKIP=$(grep -cE '^SKIP ' native-report.txt)
          PASSED=$(grep -cE '^(PASS|FAIL|XFAIL|XPASS) ' native-report.txt)
          echo "::notice title=qxwindow native digest::${PASSED} result(s), ${SKIP} skipped, exit ${STATUS}"

          # The failure mode this job is most likely to hit is not a bug in the
          # library: it is the runner not giving the plugin a desktop, or the
          # QT_QPA_PLATFORM above not reaching the process. Both look exactly like
          # a pass, so the skip count is the number that has to be zero.
          if [ "${SKIP}" -gt 0 ]; then
            echo "::error::the native cases skipped, so this run exercised no window procedure"
            exit 1
          fi
          exit "${STATUS}"

  qt612:
    # Qt 6.12 LTS, report only. 6.12.0 shipped on 2026-09-30 as the LTS that
    # follows 6.8, and decision K31 reserved a 6.12 verification leg for 4.5 -
    # but "add a leg" touches nothing under src/libs, so a patch release can
    # carry it, and having it green before 4.5 starts means the feature work
    # there does not walk into a pile of 6.12 deprecations first.
    #
    # Report only, and a job of its own rather than a fifth entry in `build`'s
    # matrix. Local development is on 6.8.3, so nobody has compiled this tree
    # against 6.12 yet and the first run may well be red; and this repository
    # integrates by pushing to master, with no pull request standing in front
    # of the gate, so a red gating leg would hold up every push until the
    # fallout is triaged. Same reasoning that made `native` a job of its own:
    # a non-gating job must not share a job with a gate.
    #
    # One Linux leg, not three: the point of this job is whether the tree
    # compiles and the tests pass against 6.12 at all, which is a property of
    # the code and not of the platform - and `build` already covers the three
    # platforms on 6.8. Promoting it to a gate is a one-line change (drop
    # continue-on-error, move the entry into the matrix) once it is green.
    name: Qt 6.12 (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          cache: true

      - name: Configure
        # A build directory of its own: the gate's `build` must stay built
        # against 6.8, because the SDK-consumption steps below it install from
        # that directory and nobody has agreed to move them to 6.12.
        #
        # The configure output is also echoed into annotations while this leg is
        # being brought up. It is report only, so a failure here costs nobody a
        # merge - but a report-only leg nobody reads is a leg that stays red for
        # the same reason CI diagnostics usually go unread: the reason lives in a
        # log behind two clicks. Annotations put it on the run page itself.
        run: |
          # `bash -e` is the default shell, so configure has to be allowed to
          # fail into STATUS instead of aborting the step before it is echoed.
          set +e
          echo "::notice title=qt612-toolchain::$(cmake --version | head -1), Qt at ${QT_ROOT_DIR:-unset}"
          echo "::notice title=qt612-qt-packages::$(ls "${QT_ROOT_DIR}/lib/cmake" 2>/dev/null | tr '\n' ' ' || echo none)"
          cmake -S . -B build-qt612 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_DEMOS=ON \
            -DWITH_TESTS=ON 2>&1 | tee configure.log
          STATUS=$?
          if [ "${STATUS}" -ne 0 ]; then
            grep -A6 -iE "^CMake Error|Could NOT find|Call Stack|error:" configure.log |
              head -80 > configure-errors.txt || true
            while IFS= read -r line; do
              printf '::error title=qt612-configure::%s\n' \
                "$(printf '%s' "${line}" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            done < configure-errors.txt
          fi
          exit "${STATUS}"

      - name: Build
        run: cmake --build build-qt612 --config Release --parallel

      - name: Test
        env:
          # Headless CI runner: use the offscreen platform to avoid GUI test failures.
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-qt612 -C Release --output-on-failure --timeout 120

  format:
    # Mandatory gate: the whole tree has been clang-formatted since release-3.x,
    # so any unformatted change now fails the build.
    #
    # This job also carries the other check that needs no toolchain - see below.
    # Keeping the gate job's name is deliberate: it is what queued here first and
    # what is named elsewhere, and the checks below are static either way.
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-format
        # Pin the exact version so CI matches .clang-format and the local toolchain.
        run: pip install 'clang-format==21.1.8'

      - name: Check formatting
        run: |
          # A pathspec like 'dir/**/*.cpp' needs at least one directory between
          # dir/ and the file - it does not match 'dir/file.cpp'. Every source
          # under examples/ used to sit at least one level down, so the glob
          # looked complete; examples/main.cpp is at the root of that tree and
          # was silently unchecked. Hence the extra pair of patterns.
          FILES=$(git ls-files \
            'src/**/*.h' 'src/**/*.cpp' \
            'demos/**/*.h' 'demos/**/*.cpp' \
            'examples/*.h' 'examples/*.cpp' \
            'examples/**/*.h' 'examples/**/*.cpp' \
            'tests/**/*.h' 'tests/**/*.cpp' \
            'projects/**/*.h' 'projects/**/*.cpp')
          clang-format --style=file --dry-run --Werror $FILES

      - name: Check the template matches the scaffolding script
        # Decision K9 makes scripts/new-project the only definition of a new
        # project and projects/template the render of it that stays in the tree
        # to be read. Two copies of one thing drift, and these did - when 4.2
        # started the template had no resources/ at all and its main.cpp had six
        # differences from the script's - which is exactly the kind of
        # divergence nobody notices, because each copy still looks plausible on
        # its own. check-template-sync.py runs the generator itself and diffs
        # the result, so a bug in the generator is caught here too and not only
        # a stale copy.
        #
        # It needs neither Qt nor an SDK, so it sits here with formatting rather
        # than behind the SDK checks in build: those are reachable only after a
        # full build, and this one should say so in seconds.
        run: python3 scripts/check-template-sync.py

  quality:
    # Coverage and sanitizers. Both need a full configure and a compiler, so
    # they share one job and one Qt install rather than paying for two. Linux-only
    # on purpose: the tooling is most uniform there, and these checks are about
    # the code, not the platform.
    #
    # clang-tidy used to live here too, which made this job's wall clock the sum
    # of three sequential analyses while only two of them are gates. It is now
    # its own job (see below) so that the report-only analysis runs on a second
    # runner instead of in front of everybody else's result.
    name: quality / ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, qt: '6.8.1' }
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov ninja-build

      - name: Coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_COVERAGE=ON \
            -DWITH_DEMOS=OFF \
            -DWITH_TESTS=ON
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure --timeout 120
          lcov --capture --directory build-coverage --output-file coverage.info \
            --ignore-errors mismatch,gcov,source
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/Qt/*' \
            --output-file coverage.filtered.info --ignore-errors unused
          # Deliberately not a gate yet (decision K8): the report is published so
          # that a baseline exists, and a threshold can be argued about later
          # with real numbers instead of guesses. That argument needs the number
          # in front of whoever is having it, so the listing also goes into the
          # step summary - an artifact is one download away, and a number nobody
          # downloads is a number nobody compares between versions.
          lcov --list coverage.filtered.info
          {
            echo "## coverage - reported, not gated (K8)"
            echo
            echo '```'
            lcov --list coverage.filtered.info
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        # Always: the report is information, not a gate (K8), so a failing test
        # in the coverage leg must not also cost us the numbers.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.filtered.info

      - name: Sanitizers (ASan + UBSan)
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt keeps a few deliberate allocations alive until exit, which leak
          # detection reports as noise. The memory-error checks - the ones that
          # catch real bugs - stay on.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_SANITIZE=ON \
            -DSANITIZE_FLAGS=address,undefined \
            -DWITH_DEMOS=OFF \
            -DWITH_TESTS=ON
          cmake --build build-sanitize --parallel
          ctest --test-dir build-sanitize --output-on-failure --timeout 300

  tidy:
    # Static analysis, report-only (decision K8): it must not gate, so it has no
    # business holding up the gating job either. Running it as its own job takes
    # it off the critical path - it analyses in parallel with coverage and the
    # sanitizers instead of after them.
    name: clang-tidy (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Analysing only what a pull request touches needs the merge base.
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build

      - name: Configure
        # Configure only. clang-tidy reads compile_commands.json; nothing here
        # has to be compiled, so this step costs seconds, not minutes.
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DWITH_DEMOS=OFF \
            -DWITH_TESTS=OFF

      - name: Analyse
        # Reporting only for now. The tree has never been analysed, so the first
        # run is guaranteed to find things; gating on it before they are triaged
        # would just train everyone to ignore a red job. The checks are limited
        # to the AST-matcher families - clang-analyzer can join once the noise is
        # down.
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u

          # Analyse what changed, which is also the cheapest way to satisfy the
          # roadmap's "report new findings only". A push event carries the tip
          # before the push, so a push scopes exactly like a pull request does -
          # and that matters here, because this repository integrates by pushing
          # to release-x rather than through pull requests. A push that touches
          # neither the sources nor their headers therefore costs nothing.
          SCOPE="whole tree"
          FILES=""
          BASE=""
          CONTEXT=""
          LINE_FILTER=""
          NOTHING="src/libs has no translation unit to analyse"
          if [ -n "${BASE_REF:-}" ]; then
            BASE=$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null || true)
            CONTEXT="the pull request"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "${BEFORE}" | grep -qE '^0+$'; then
            # All-zero means a new branch, where there is nothing to compare to.
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BASE="${BEFORE}"
              CONTEXT="the push"
            fi
          fi

          if [ -n "${BASE}" ]; then
            CHANGED=$(git diff --name-only --diff-filter=d "${BASE}" HEAD -- src/libs || true)
            if printf '%s\n' "${CHANGED}" | grep -qE '\.h$'; then
              # A header change can reach every translation unit, so a scoped run
              # would report a fraction of what it changed. Fall back to the
              # whole tree rather than quietly under-report - and note that the
              # line filter below is deliberately *not* applied here: a finding
              # caused by a header shows up on a line of some .cpp that the
              # change never touched, and filtering those out would hide exactly
              # the fallout the fallback exists to catch.
              SCOPE="whole tree (${CONTEXT} changes a header)"
              FILES=$(git ls-files src/libs | grep -E '\.cpp$' || true)
            else
              SCOPE="changed in ${CONTEXT}"
              FILES=$(printf '%s\n' "${CHANGED}" | grep -E '\.cpp$' || true)
              # Report what the change *introduces*, not everything the files it
              # touched were already guilty of: src/libs carries hundreds of
              # bugprone/performance findings, so a per-file scope drowns the
              # handful that matter. Filtering by line is what "introduced here"
              # actually means. See scripts/tidy_line_filter.py.
              LINE_FILTER=$(python3 scripts/tidy_line_filter.py "${BASE}" HEAD --path src/libs || true)
              # Two ways for the scoped branch to end up with nothing to report,
              # and they get different reasons: no translation unit changed at
              # all, or one did but without a single new line under src/libs
              # (clang-tidy reads an empty filter as "filter everything out", so
              # that run would cost minutes to say nothing - the guard below
              # lives on both conditions).
              if [ -z "${FILES}" ]; then
                NOTHING="${CONTEXT} changed no translation unit in src/libs"
              elif [ "${LINE_FILTER}" = "[]" ]; then
                NOTHING="${CONTEXT} touched no line under src/libs"
              fi
            fi
          else
            FILES=$(git ls-files src/libs | grep -E '\.cpp$' || true)
          fi

          if [ -z "${FILES}" ] || [ "${LINE_FILTER}" = "[]" ]; then
            echo "Nothing to analyse: ${NOTHING}."
            {
              echo "## clang-tidy — report only (K8)"
              echo
              echo "Nothing to analyse: ${NOTHING}."
            } >> "${GITHUB_STEP_SUMMARY}"
            # Same reason as the digest below: a machine has to be able to tell
            # "nothing was in scope" apart from "the analysis produced nothing".
            echo "::notice title=clang-tidy digest::nothing to analyse: ${NOTHING}"
            exit 0
          fi

          # src/libs/qxapp/qxpropertyeditor.cpp defines its Q_OBJECT classes in the .cpp
          # and includes its own .moc because of it, and AUTOMOC only puts that file in
          # the target's autogen directory. Configure does not create it, so clang-tidy
          # stops at the include and the whole translation unit reports nothing - which
          # cannot be told apart from a clean run. Generating it is enough to fix that,
          # and it is worth doing only when the file is in scope: a scoped push normally
          # has nothing to do with qxapp, and the target pulls in the libraries it
          # depends on, which is the difference between seconds and a build.
          if printf '%s\n' "${FILES}" | grep -qxF "src/libs/qxapp/qxpropertyeditor.cpp"; then
            echo "Generating the qxapp moc sources that qxpropertyeditor.cpp includes"
            cmake --build build-tidy --target qxapp_autogen
          fi

          printf '%s\n' "${FILES}" > tidy-files.txt
          echo "Analysing $(wc -l < tidy-files.txt) file(s): ${SCOPE}"

          # One worker per file, one log per file. clang-tidy writes a diagnostic
          # with several write() calls, so several workers sharing one stream
          # interleave them into unreadable lines. The line filter (empty when
          # the whole tree is in scope) arrives as the third argument.
          JOBS=$(nproc)
          WORK=$(mktemp -d)
          cat > "${WORK}/tidy-one" <<'SH'
          #!/bin/sh
          FILTER_OPT=""
          if [ -n "$3" ]; then
            FILTER_OPT="-line-filter=$3"
          fi
          # shellcheck disable=SC2086 # the empty case must vanish, not pass ""
          clang-tidy -p build-tidy --quiet $FILTER_OPT \
            -checks='-*,bugprone-*,performance-*' "$1" > "$2" 2>&1 || true
          SH
          chmod +x "${WORK}/tidy-one"

          START=$(date +%s)
          while IFS= read -r f; do
            printf '%s\0%s\0%s\0' "$f" "${WORK}/$(echo "$f" | tr '/' '_').log" "${LINE_FILTER}"
          done < tidy-files.txt | xargs -0 -P "${JOBS}" -n 3 "${WORK}/tidy-one" || true
          ELAPSED=$(( $(date +%s) - START ))

          cat "${WORK}"/*.log > clang-tidy.log
          FINDINGS=$(grep -cE ': (warning|error):' clang-tidy.log || true)
          echo "===== findings ====="
          echo "${FINDINGS}"

          # A filter clang-tidy did not understand would make every file report
          # nothing, and "0 findings" is exactly what a clean run looks like -
          # so the failure has to be loud or it reads as good news.
          if [ -n "${LINE_FILTER}" ] \
            && grep -q "unknown argument.*line-filter" clang-tidy.log; then
            echo "::error::clang-tidy rejected -line-filter; the findings above are empty because nothing was analysed, not because nothing was found"
          fi

          # Put the digest where it will actually be read: the step summary is
          # one click away from the job, while an artifact is one download away.
          {
            echo "## clang-tidy — report only (K8)"
            echo
            echo "- scope: ${SCOPE}"
            if [ -n "${LINE_FILTER}" ]; then
              echo "- findings are limited to the lines this change touched, so a"
              echo "  clean run means \"introduced nothing new\", not \"no findings\""
            fi
            echo "- files analysed: $(wc -l < tidy-files.txt)"
            echo "- findings: ${FINDINGS}"
            echo "- wall clock: ${ELAPSED}s across ${JOBS} parallel jobs"
            echo "- checks: \`-*,bugprone-*,performance-*\`"
            echo
            if [ "${FINDINGS}" -gt 0 ]; then
              echo "| check | findings |"
              echo "| :--- | ---: |"
              grep -oE '\[[a-z0-9._-]+\]$' clang-tidy.log \
                | tr -d '[]' | sort | uniq -c | sort -rn | awk '{printf "| %s | %s |\n", $2, $1}'
              echo
              echo "<details><summary>First 20 findings</summary>"
              echo
              echo '```'
              grep -E ': (warning|error):' clang-tidy.log | head -20
              echo '```'
              echo
              echo "</details>"
            else
              echo "No findings."
            fi
            echo
            echo "The full log is attached to this run as the \`clang-tidy-log\` artifact."
          } >> "${GITHUB_STEP_SUMMARY}"

          # An annotation is the only part of this job a machine can read without
          # logging in. The step summary needs a browser session (the check-runs
          # API leaves output.summary empty) and so does the log, so neither can
          # answer the question this job exists to answer: did the scoped run
          # really report the lines it was supposed to, or did it find nothing
          # because the filter matched nothing? Annotations come back from the
          # check-runs API anonymously, so the digest goes out as one. Newlines
          # and percent signs need the workflow-command escapes.
          ANNOTATION="scope=${SCOPE}%0Afiles analysed=$(wc -l < tidy-files.txt)%0Afindings=${FINDINGS}"
          if [ -n "${LINE_FILTER}" ]; then
            ANNOTATION="${ANNOTATION}%0A(filtered to the lines this change touched)"
          fi
          if [ "${FINDINGS}" -gt 0 ]; then
            # head/paste would not do: paste -d takes a list of *characters* to
            # cycle through, so -d'%0A' separates with "%", then "0", then "A".
            # awk joins with the whole escape instead.
            ANNOTATION="${ANNOTATION}%0A%0A$(grep -E ': (warning|error):' clang-tidy.log \
              | head -20 | sed 's/%/%25/g' | awk 'NR > 1 { printf "%%0A" } { printf "%s", $0 }')"
          fi
          echo "::notice title=clang-tidy digest::${ANNOTATION}"

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          # The analysis exits early when src/libs has nothing to look at, and an
          # empty artifact is not a failure.
          if-no-files-found: ignore
