name: CI

on:
  push:
    branches: [ master, develop, 'release-*' ]
  pull_request:
    branches: [ master, develop, 'release-*' ]
  workflow_dispatch:

jobs:
  build:
    name: build / ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  qt: '6.8.1' }
          - { os: windows-latest, qt: '6.8.1' }
          - { os: macos-latest,   qt: '6.8.1' }
          - { os: ubuntu-latest,  qt: '5.15.2' }
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_DEMOS=ON
          -DWITH_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          # Headless CI runner: use the offscreen platform to avoid GUI test failures.
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Check the installed SDK is consumable
        # One leg is enough: the export is platform independent, and it is the
        # combination of the installed targets, headers and the Qt dependency
        # that is being exercised, not the compiler. projects/consume is a real
        # downstream project that knows nothing but find_package(QtCanpool).
        if: matrix.os == 'ubuntu-latest' && matrix.qt == '6.8.1'
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/sdk"
          cmake --install build --config Release --prefix "$RUNNER_TEMP/sdk" --component Devel
          # Append rather than override: CMAKE_PREFIX_PATH already carries Qt.
          export CMAKE_PREFIX_PATH="$RUNNER_TEMP/sdk:$CMAKE_PREFIX_PATH"
          cmake -S projects/consume -B "$RUNNER_TEMP/consume" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/consume" --parallel

      - name: Check the scaffolding script produces a buildable project
        # Decision K9 put the skeleton in a script rather than in a second
        # template project, which makes the script the only thing between a
        # newcomer and a broken start - and the only way to know it still works
        # is to run it against a real SDK. Reuses the prefix installed above.
        if: matrix.os == 'ubuntu-latest' && matrix.qt == '6.8.1'
        run: |
          python3 scripts/new-project ci_scaffold -o "$RUNNER_TEMP/scaffold" \
            --build --sdk "$RUNNER_TEMP/sdk"
          test -x "$RUNNER_TEMP/scaffold/ci_scaffold/build/ci_scaffold"

  format:
    # Mandatory gate: the whole tree has been clang-formatted since release-3.x,
    # so any unformatted change now fails the build.
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-format
        # Pin the exact version so CI matches .clang-format and the local toolchain.
        run: pip install 'clang-format==21.1.8'

      - name: Check formatting
        run: |
          FILES=$(git ls-files \
            'src/**/*.h' 'src/**/*.cpp' \
            'demos/**/*.h' 'demos/**/*.cpp' \
            'examples/**/*.h' 'examples/**/*.cpp' \
            'tests/**/*.h' 'tests/**/*.cpp' \
            'projects/**/*.h' 'projects/**/*.cpp')
          clang-format --style=file --dry-run --Werror $FILES

  quality:
    # Coverage and sanitizers. Both need a full configure and a compiler, so
    # they share one job and one Qt install rather than paying for two. Linux-only
    # on purpose: the tooling is most uniform there, and these checks are about
    # the code, not the platform.
    #
    # clang-tidy used to live here too, which made this job's wall clock the sum
    # of three sequential analyses while only two of them are gates. It is now
    # its own job (see below) so that the report-only analysis runs on a second
    # runner instead of in front of everybody else's result.
    name: quality / ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, qt: '6.8.1' }
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov ninja-build

      - name: Coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_COVERAGE=ON \
            -DWITH_DEMOS=OFF \
            -DWITH_TESTS=ON
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure --timeout 120
          lcov --capture --directory build-coverage --output-file coverage.info \
            --ignore-errors mismatch,gcov,source
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/Qt/*' \
            --output-file coverage.filtered.info --ignore-errors unused
          # Deliberately not a gate yet (decision K8): the report is published so
          # that a baseline exists, and a threshold can be argued about later
          # with real numbers instead of guesses.
          lcov --list coverage.filtered.info

      - name: Upload coverage report
        # Always: the report is information, not a gate (K8), so a failing test
        # in the coverage leg must not also cost us the numbers.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.filtered.info

      - name: Sanitizers (ASan + UBSan)
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt keeps a few deliberate allocations alive until exit, which leak
          # detection reports as noise. The memory-error checks - the ones that
          # catch real bugs - stay on.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_SANITIZE=ON \
            -DSANITIZE_FLAGS=address,undefined \
            -DWITH_DEMOS=OFF \
            -DWITH_TESTS=ON
          cmake --build build-sanitize --parallel
          ctest --test-dir build-sanitize --output-on-failure --timeout 300

  tidy:
    # Static analysis, report-only (decision K8): it must not gate, so it has no
    # business holding up the gating job either. Running it as its own job takes
    # it off the critical path - it analyses in parallel with coverage and the
    # sanitizers instead of after them.
    name: clang-tidy (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Analysing only what a pull request touches needs the merge base.
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build

      - name: Configure
        # Configure only. clang-tidy reads compile_commands.json; nothing here
        # has to be compiled, so this step costs seconds, not minutes.
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DWITH_DEMOS=OFF \
            -DWITH_TESTS=OFF

      - name: Analyse
        # Reporting only for now. The tree has never been analysed, so the first
        # run is guaranteed to find things; gating on it before they are triaged
        # would just train everyone to ignore a red job. The checks are limited
        # to the AST-matcher families - clang-analyzer can join once the noise is
        # down.
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u

          # Analyse what changed, which is also the cheapest way to satisfy the
          # roadmap's "report new findings only". A push event carries the tip
          # before the push, so a push scopes exactly like a pull request does -
          # and that matters here, because this repository integrates by pushing
          # to release-x rather than through pull requests. A push that touches
          # neither the sources nor their headers therefore costs nothing.
          SCOPE="whole tree"
          FILES=""
          BASE=""
          CONTEXT=""
          NOTHING="src/libs has no translation unit to analyse"
          if [ -n "${BASE_REF:-}" ]; then
            BASE=$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null || true)
            CONTEXT="the pull request"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "${BEFORE}" | grep -qE '^0+$'; then
            # All-zero means a new branch, where there is nothing to compare to.
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BASE="${BEFORE}"
              CONTEXT="the push"
            fi
          fi

          if [ -n "${BASE}" ]; then
            CHANGED=$(git diff --name-only --diff-filter=d "${BASE}" HEAD -- src/libs || true)
            if printf '%s\n' "${CHANGED}" | grep -qE '\.h$'; then
              # A header change can reach every translation unit, so a scoped run
              # would report a fraction of what it changed. Fall back to the
              # whole tree rather than quietly under-report.
              SCOPE="whole tree (${CONTEXT} changes a header)"
              FILES=$(git ls-files src/libs | grep -E '\.cpp$' || true)
            else
              SCOPE="changed in ${CONTEXT}"
              FILES=$(printf '%s\n' "${CHANGED}" | grep -E '\.cpp$' || true)
              if [ -z "${FILES}" ]; then
                NOTHING="${CONTEXT} changed no translation unit in src/libs"
              fi
            fi
          else
            FILES=$(git ls-files src/libs | grep -E '\.cpp$' || true)
          fi

          if [ -z "${FILES}" ]; then
            echo "Nothing to analyse: ${NOTHING}."
            {
              echo "## clang-tidy — report only (K8)"
              echo
              echo "Nothing to analyse: ${NOTHING}."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          printf '%s\n' "${FILES}" > tidy-files.txt
          echo "Analysing $(wc -l < tidy-files.txt) file(s): ${SCOPE}"

          # One worker per file, one log per file. clang-tidy writes a diagnostic
          # with several write() calls, so several workers sharing one stream
          # interleave them into unreadable lines.
          JOBS=$(nproc)
          WORK=$(mktemp -d)
          cat > "${WORK}/tidy-one" <<'SH'
          #!/bin/sh
          clang-tidy -p build-tidy --quiet \
            -checks='-*,bugprone-*,performance-*' "$1" > "$2" 2>&1 || true
          SH
          chmod +x "${WORK}/tidy-one"

          START=$(date +%s)
          while IFS= read -r f; do
            printf '%s\0%s\0' "$f" "${WORK}/$(echo "$f" | tr '/' '_').log"
          done < tidy-files.txt | xargs -0 -P "${JOBS}" -n 2 "${WORK}/tidy-one" || true
          ELAPSED=$(( $(date +%s) - START ))

          cat "${WORK}"/*.log > clang-tidy.log
          FINDINGS=$(grep -cE ': (warning|error):' clang-tidy.log || true)
          echo "===== findings ====="
          echo "${FINDINGS}"

          # Put the digest where it will actually be read: the step summary is
          # one click away from the job, while an artifact is one download away.
          {
            echo "## clang-tidy — report only (K8)"
            echo
            echo "- scope: ${SCOPE}"
            echo "- files analysed: $(wc -l < tidy-files.txt)"
            echo "- findings: ${FINDINGS}"
            echo "- wall clock: ${ELAPSED}s across ${JOBS} parallel jobs"
            echo "- checks: \`-*,bugprone-*,performance-*\`"
            echo
            if [ "${FINDINGS}" -gt 0 ]; then
              echo "| check | findings |"
              echo "| :--- | ---: |"
              grep -oE '\[[a-z0-9._-]+\]$' clang-tidy.log \
                | tr -d '[]' | sort | uniq -c | sort -rn | awk '{printf "| %s | %s |\n", $2, $1}'
              echo
              echo "<details><summary>First 20 findings</summary>"
              echo
              echo '```'
              grep -E ': (warning|error):' clang-tidy.log | head -20
              echo '```'
              echo
              echo "</details>"
            else
              echo "No findings."
            fi
            echo
            echo "The full log is attached to this run as the \`clang-tidy-log\` artifact."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          # The analysis exits early when src/libs has nothing to look at, and an
          # empty artifact is not a failure.
          if-no-files-found: ignore
